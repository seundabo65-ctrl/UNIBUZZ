<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UniBuzz — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background-color: #060913; color: #fff; font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow-x: hidden; overflow-y: auto; }
  .bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-glow::before { content: ''; position: absolute; bottom: -100px; left: 50%; transform: translateX(-50%); width: 120%; height: 300px; background: radial-gradient(ellipse at bottom, rgba(255, 215, 0, 0.15) 0%, transparent 70%); }
  .bg-glow::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.4) 1px, transparent 1px), radial-gradient(circle at 80% 40%, rgba(255, 215, 0, 0.3) 1px, transparent 1px), radial-gradient(circle at 50% 80%, rgba(255, 215, 0, 0.4) 1px, transparent 1px), radial-gradient(circle at 90% 10%, rgba(255, 215, 0, 0.2) 1px, transparent 1px), radial-gradient(circle at 30% 60%, rgba(255, 215, 0, 0.3) 1px, transparent 1px); background-size: 200px 200px; opacity: 0.5; }
  .container { width: 100%; max-width: 420px; position: relative; z-index: 2; padding: 10px 0; }
  .logo-wrap { text-align: center; margin-bottom: 24px; }
  .logo-icon { font-size: 2.5rem; margin-bottom: 5px; display: inline-block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .logo-text { font-weight: 800; font-size: 2.2rem; letter-spacing: -1.5px; line-height: 1; }
  .logo-text .uni { color: #fff; } .logo-text .buzz { color: #FFD700; }
  .tagline { font-family: 'Dancing Script', cursive; color: #FFD700; font-size: 1.2rem; margin-top: 2px; }
  .futa-sub { font-size: 0.6rem; letter-spacing: 2px; color: #888; margin-top: 8px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .futa-sub::before, .futa-sub::after { content: ''; width: 20px; height: 1px; background: #444; }
  .auth-card { background: rgba(15, 20, 35, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 24px; padding: 28px 22px; box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05); }
  .tabs { display: flex; background: rgba(0,0,0,0.4); border-radius: 50px; padding: 5px; margin-bottom: 22px; position: relative; border: 1px solid rgba(255,255,255,0.05); }
  .tab { flex: 1; text-align: center; padding: 11px; font-weight: 600; font-size: 0.9rem; color: #888; cursor: pointer; border-radius: 50px; transition: all 0.3s ease; position: relative; z-index: 2; }
  .tab.active { color: #000; }
  .tab-slider { position: absolute; top: 5px; left: 5px; width: calc(50% - 5px); height: calc(100% - 10px); background: linear-gradient(135deg, #FFD700, #FFA500); border-radius: 50px; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
  .tab-slider.right { transform: translateX(100%); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.78rem; color: #ccc; margin-bottom: 6px; font-weight: 500; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-wrap svg { position: absolute; left: 14px; width: 18px; height: 18px; fill: #666; transition: fill 0.2s; }
  .input-wrap input, .input-wrap select { width: 100%; padding: 14px 14px 14px 42px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 0.9rem; font-family: 'Poppins', sans-serif; outline: none; transition: border 0.2s, box-shadow 0.2s; appearance: none; }
  .input-wrap input:focus, .input-wrap select:focus { border-color: #FFD700; box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1); }
  .input-wrap input::placeholder { color: #555; }
  .input-wrap select option { background: #151515; color: #fff; }
  .eye-btn { position: absolute; right: 14px; background: none; border: none; cursor: pointer; padding: 0; display: flex; }
  .eye-btn svg { position: static; width: 18px; height: 18px; fill: #666; }
  .field-hint { font-size: 0.7rem; color: #888; margin-top: 6px; padding-left: 4px; line-height: 1.4; }
  .field-hint .hint-emoji { margin-right: 4px; }
  .help-link { display: block; text-align: center; color: #FFD700; font-size: 0.82rem; text-decoration: none; margin-top: 4px; margin-bottom: 16px; font-weight: 500; }
  .help-link:active { opacity: 0.7; }

  .role-section { margin-bottom: 16px; display: none; }
  .role-section.show { display: block; }
  .role-section > label { display: block; font-size: 0.78rem; color: #FFD700; margin-bottom: 8px; font-weight: 600; }
  .role-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .role-btn { padding: 12px 6px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #888; font-family: 'Poppins', sans-serif; font-size: 0.72rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; line-height: 1.2; }
  .role-btn .role-icon { font-size: 1.2rem; }
  .role-btn.active { background: rgba(255, 215, 0, 0.15); border-color: #FFD700; color: #FFD700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }

  .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; font-family: 'Poppins', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); margin-top: 6px; }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .submit-btn svg { width: 18px; height: 18px; fill: #000; }
  .footer { text-align: center; margin-top: 24px; font-size: 0.78rem; color: #666; }
  .footer span { color: #FFD700; font-weight: 600; }
  .message { margin-top: 14px; padding: 11px; border-radius: 10px; font-size: 0.82rem; text-align: center; display: none; }
  .message.show { display: block; }
  .message.error { background: rgba(255, 60, 60, 0.1); border: 1px solid rgba(255, 60, 60, 0.3); color: #ff6b6b; }
  .message.success { background: rgba(80, 220, 120, 0.1); border: 1px solid rgba(80, 220, 120, 0.3); color: #4ade80; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.3); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-icon">🐝</div>
    <div class="logo-text"><span class="uni">Uni</span><span class="buzz">Buzz</span></div>
    <div class="tagline">Know the Buzz</div>
    <div class="futa-sub">FUTA Student Platform</div>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <div class="tab-slider" id="tabSlider"></div>
      <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
      <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">

      <div class="form-group signup-only" style="display:none;">
        <label>Full Name</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" id="fullName" placeholder="e.g. Seun Dabó" autocomplete="name">
        </div>
      </div>

      <!-- MATRIC with fresher hint -->
      <div class="form-group signup-only" style="display:none;">
        <label>Matric Number</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 4h16v2H4zm0 14h16v2H4z"/></svg>
          <input type="text" id="matricNo" placeholder="e.g. IPE/22/1234">
        </div>
        <div class="field-hint">
          <span class="hint-emoji">💡</span>Freshers: enter your JAMB registration number for now. You can update it to your matric number later.
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" id="email" placeholder="you@futa.edu.ng" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="current-password" required>
          <button type="button" class="eye-btn" onclick="togglePassword()">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group signup-only" style="display:none;">
        <label>School / Faculty</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 2.18l7.53 4.09L12 13.36 4.47 9.27 12 5.18zM5 12.5V17c0 1.66 3.13 3 7 3s7-1.34 7-3v-4.5l-7 3.8-7-3.8z"/></svg>
          <select id="school" onchange="updateDepartments()">
            <option value="">Select school</option>
            <option value="SAAT">🌾 School of Agriculture & Agricultural Technology (SAAT)</option>
            <option value="SEET">⚙️ School of Engineering & Engineering Technology (SEET)</option>
            <option value="SEMS">🌍 School of Earth & Mineral Sciences (SEMS)</option>
            <option value="SET">🏛️ School of Environmental Technology (SET)</option>
            <option value="SOS">🔬 School of Sciences (SOS)</option>
            <option value="SOC">💻 School of Computing (SOC)</option>
            <option value="SMAT">📊 School of Management Technology (SMAT)</option>
            <option value="SHHT">🏥 School of Health & Health Technology (SHHT)</option>
            <option value="Other">📚 Other</option>
          </select>
        </div>
      </div>

      <div class="form-group signup-only" style="display:none;">
        <label>Department</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
          <select id="department">
            <option value="">Select school first</option>
          </select>
        </div>
      </div>

      <div class="role-section signup-only" id="roleSection" style="display:none;">
        <label>What do you want to do?</label>
        <div class="role-options">
          <button type="button" class="role-btn active" data-role="student" onclick="selectRole('student')">
            <span class="role-icon">📚</span>
            Just Study
          </button>
          <button type="button" class="role-btn" data-role="vendor" onclick="selectRole('vendor')">
            <span class="role-icon">🏪</span>
            Business
          </button>
          <button type="button" class="role-btn" data-role="both" onclick="selectRole('both')">
            <span class="role-icon">✨</span>
            Both
          </button>
        </div>
      </div>

      <a href="javascript:void(0)" class="help-link" id="helpLink" onclick="handleHelp()">Need help? Contact us</a>

      <button type="submit" class="submit-btn" id="submitBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span id="btnText">Login</span>
      </button>

      <div class="message" id="message"></div>
    </form>
  </div>

  <div class="footer">Built for <span>FUTA</span> students 🎓</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://wrjdtcmzccgrmufinxbo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vNJRQlZeNWcMl6crV8tOYQ_d_x-13pC';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const WHATSAPP_NUMBER = '2349152029179';

  const SCHOOL_DATA = {
    'SAAT': ['Agricultural Economics & Extension', 'Animal Production & Health', 'Crop, Soil & Pest Management', 'Fisheries & Aquaculture Technology', 'Food Science & Technology', 'Forestry & Wood Technology', 'Ecotourism & Wildlife Management'],
    'SEET': ['Agricultural Engineering', 'Chemical Engineering', 'Civil Engineering', 'Computer Engineering', 'Electrical & Electronics Engineering', 'Industrial & Production Engineering', 'Mechanical Engineering', 'Metallurgical & Materials Engineering', 'Mining Engineering', 'Petroleum Engineering'],
    'SEMS': ['Applied Geology', 'Applied Geophysics', 'Applied Mineral & Petrology', 'Meteorology & Climate Science', 'Marine Science & Technology', 'Remote Sensing & GIS'],
    'SET': ['Architecture', 'Building', 'Estate Management', 'Industrial Design', 'Quantity Surveying', 'Surveying & Geoinformatics', 'Urban & Regional Planning'],
    'SOS': ['Biochemistry', 'Biology', 'Chemistry', 'Mathematical Sciences', 'Microbiology', 'Physics', 'Statistics'],
    'SOC': ['Computer Science', 'Cyber Security', 'Information Technology', 'Software Engineering'],
    'SMAT': ['Business Administration', 'Entrepreneurship', 'Project Management Technology', 'Transport Management Technology'],
    'SHHT': ['Biomedical Technology', 'Environmental Health Science', 'Human Anatomy', 'Human Physiology', 'Nursing Science', 'Public Health'],
    'Other': ['Other Department']
  };

  let currentTab = 'login';
  let selectedRole = 'student';

  (async function checkSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { window.location.href = 'dashboard.html'; }
  })();

  function switchTab(tab) {
    currentTab = tab;
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const slider = document.getElementById('tabSlider');
    const btnText = document.getElementById('btnText');
    const signupFields = document.querySelectorAll('.signup-only');
    const helpLink = document.getElementById('helpLink');

    if (tab === 'signup') {
      signupTab.classList.add('active'); loginTab.classList.remove('active');
      slider.classList.add('right'); btnText.textContent = 'Create Account';
      signupFields.forEach(f => f.style.display = 'block');
      helpLink.style.display = 'none';
    } else {
      loginTab.classList.add('active'); signupTab.classList.remove('active');
      slider.classList.remove('right'); btnText.textContent = 'Login';
      signupFields.forEach(f => f.style.display = 'none');
      helpLink.style.display = 'block';
    }
    hideMessage();
  }

  function updateDepartments() {
    const school = document.getElementById('school').value;
    const deptSelect = document.getElementById('department');
    deptSelect.innerHTML = '';
    if (!school) {
      deptSelect.innerHTML = '<option value="">Select school first</option>';
      return;
    }
    deptSelect.innerHTML = '<option value="">Select department</option>';
    (SCHOOL_DATA[school] || []).forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      deptSelect.appendChild(opt);
    });
  }

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.role === role);
    });
  }

  function togglePassword() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') { pwd.type = 'text'; icon.style.fill = '#FFD700'; }
    else { pwd.type = 'password'; icon.style.fill = '#666'; }
  }

  function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text; msg.className = 'message show ' + type;
  }
  function hideMessage() { document.getElementById('message').className = 'message'; }

  function setLoading(isLoading) {
    const btn = document.getElementById('submitBtn');
    const txt = document.getElementById('btnText');
    btn.disabled = isLoading;
    if (isLoading) {
      txt.innerHTML = '<span class="spinner"></span>Please wait...';
    } else {
      txt.textContent = currentTab === 'login' ? 'Login' : 'Create Account';
    }
  }

  function handleHelp() {
    const email = document.getElementById('email').value.trim();
    const message = email ? `Hi UniBuzz team, I need help. My email is: ${email}` : `Hi UniBuzz team, I need help.`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    hideMessage();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) { showMessage('Please fill in all fields', 'error'); return; }
    if (password.length < 6) { showMessage('Password must be at least 6 characters', 'error'); return; }

    setLoading(true);

    try {
      if (currentTab === 'signup') {
        const fullName = document.getElementById('fullName').value.trim();
        const matricNo = document.getElementById('matricNo').value.trim();
        const school = document.getElementById('school').value;
        const department = document.getElementById('department').value;

        if (!fullName || !matricNo || !school || !department) {
          showMessage('Please fill in all fields', 'error');
          setLoading(false);
          return;
        }

        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.user) throw new Error('Signup failed — try again');

        const { error: profileError } = await supabaseClient.from('profiles').insert({
          id: data.user.id,
          email: email,
          full_name: fullName,
          matric_no: matricNo,
          department: department,
          school: school,
          role: selectedRole,
          is_admin: false
        });
        if (profileError) {
          console.error('Profile error:', profileError);
          throw new Error('Account created but profile setup failed.');
        }

        if (selectedRole === 'vendor' || selectedRole === 'both') {
          const { error: vendorError } = await supabaseClient.from('vendors').insert({
            user_id: data.user.id,
            business_name: 'My Business',
            category: 'Food',
            status: 'pending'
          });
          if (vendorError) console.error('Vendor init error:', vendorError);
        }

        showMessage('✅ Welcome to UniBuzz! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);

      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        showMessage('✅ Login successful! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
      }
    } catch (err) {
      console.error(err);
      let msg = err.message || 'Something went wrong';
      if (msg.includes('already registered') || msg.includes('already been registered')) msg = 'This email is already registered. Try logging in.';
      if (msg.includes('Invalid login') || msg.includes('invalid_credentials')) msg = 'Wrong email or password';
      showMessage(msg, 'error');
      setLoading(false);
    }
  }
</script>
</body>
</html>
